<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CauliVision — AI-Based Cauliflower Health &amp; Market Intelligence{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">AICW</span>
      <span class="brand-text">CauliVision</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open menu">☰</button>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="{{ url_for('analyze_page') }}" class="{% if request.path == '/analyze' %}active{% endif %}">Analyze</a>
      <a href="{{ url_for('cofounders') }}" class="{% if request.path == '/cofounders' %}active{% endif %}">Co-founders</a>
      <a href="{{ url_for('team_page') }}" class="{% if request.path == '/team' %}active{% endif %}">Team</a>
      <a href="{{ url_for('guide_page') }}" class="{% if request.path == '/guide' %}active{% endif %}">Guide</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <p>CauliVision · Student project with Microsoft · Edunet · APSSDC · SAP</p>
    <p>Guide: Abdul Aziz Md · Team: Ch. Joshitha, R. Drakshayani, Ch. Adhi Lakshmi</p>
  </footer>
  <script>
    document.querySelector(".nav-toggle")?.addEventListener("click", () => {
      document.querySelector(".nav-links")?.classList.toggle("open");
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
